<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Two spheres rotating inside each other">
  <title>RevolveRelate</title>
  <defs>
    <radialGradient id="glow" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="core" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
  </defs>
  <rect width="320" height="320" rx="36" fill="#0b1220"/>
  <g transform="translate(160 160)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="118" ry="118" fill="none" stroke="#818cf8" stroke-width="1.4" opacity="0.85"/>
      <ellipse cx="0" cy="0" rx="118" ry="42" fill="none" stroke="#a5b4fc" stroke-width="1.1" opacity="0.7"/>
      <ellipse cx="0" cy="0" rx="42" ry="118" fill="none" stroke="#6366f1" stroke-width="1.1" opacity="0.65"/>
      <ellipse cx="0" cy="0" rx="118" ry="78" fill="none" stroke="#818cf8" stroke-width="0.8" opacity="0.45"/>
    </g>
    <circle r="118" fill="url(#glow)" opacity="0.18"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
      <circle r="48" fill="url(#core)" opacity="0.95"/>
      <ellipse cx="0" cy="0" rx="48" ry="48" fill="none" stroke="#ecfeff" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="48" ry="16" fill="none" stroke="#cffafe" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="16" ry="48" fill="none" stroke="#67e8f9" stroke-width="1"/>
    </g>
  </g>
</svg>
